name: build

# Publishes a container image to GHCR on every push to main.
# The Unraid box then just pulls the image — no source ever lands on the host.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs and config samples don't change the image.
    paths-ignore:
      - '**/*.md'
      - 'config/config.example.yaml'
      - 'LICENSE'
      - 'Makefile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Behavioural tests against mock BluOS players
        run: python -m tests.test_sequence

      - name: First-run seeding tests
        run: python -m tests.test_bootstrap

      - name: LSDP discovery protocol tests
        run: python -m tests.test_lsdp

      - name: Auto-discovery and zone-override tests
        run: python -m tests.test_discovery

      - name: Endpoint authorisation tests
        run: python -m tests.test_auth

      - name: Subnet / CIDR handling tests
        run: python -m tests.test_subnet

      - name: Single-room test endpoint
        run: python -m tests.test_single_room

      - name: Multiple doorbells
        run: python -m tests.test_doorbells

      - name: Validate the Unraid template and config sample
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('templates/bluos-doorbell.xml')"
          python -c "import xml.etree.ElementTree as ET; ET.parse('ca_profile.xml')"
          python -c "import yaml; yaml.safe_load(open('config/config.example.yaml'))"
          python -c "import yaml; yaml.safe_load(open('unraid/docker-compose.yml'))"

  publish:
    # A broken build must never reach the doorbell.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Unraid is x86_64. Add linux/arm64 here only if you ever need it —
          # it roughly doubles build time.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "On Unraid: Docker tab -> Check for Updates -> Apply Update" >> $GITHUB_STEP_SUMMARY
