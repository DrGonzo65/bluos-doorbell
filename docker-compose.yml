services:
  bluos-doorbell:
    build: .
    image: bluos-doorbell:latest
    container_name: bluos-doorbell
    restart: unless-stopped

    # Host networking matters here for two reasons:
    #   1. the players must be able to fetch the chime from this service
    #   2. tools/discover.py uses mDNS, which does not cross a bridge network
    network_mode: host

    volumes:
      - ./config:/config
      - ./chimes:/chimes

    environment:
      DOORBELL_CONFIG: /config/config.yaml
      DOORBELL_CHIME_DIR: /chimes
      TZ: America/Los_Angeles
