# BluOS doorbell chime service — configuration
#
# Copy to config.yaml and edit. Find your players' IPs with:
#   docker compose run --rm bluos-doorbell python -m tools.discover
# or from the BluOS app: Settings -> Player -> Network.

# URL the PLAYERS use to fetch the chime file. Leave blank to auto-detect the
# Docker host's primary IP — set it explicitly if the host is multi-homed or
# the players are on a different VLAN.
service_base_url: ""
listen_host: "0.0.0.0"
# 8080 collides with all sorts of things on an Unraid box, so the default is 8095.
listen_port: 8095

log_level: INFO

zones:
  - name: Kitchen
    host: 192.168.1.51
    chime_volume: 35          # optional per-zone override

  - name: Living Room
    host: 192.168.1.52
    chime_volume: 30

  - name: Office
    host: 192.168.1.53

  - name: Primary Bedroom
    host: 192.168.1.54
    enabled: true
    chime_when_idle: false    # don't wake a silent bedroom
    chime_volume: 20

chime:
  file: doorbell.mp3
  # Set this to the real length of your file. Too short clips the chime;
  # too long leaves a silent gap before the music returns.
  duration_seconds: 2.3
  tail_seconds: 0.8
  default_volume: 30

behaviour:
  # Ignore repeat rings inside this window. This is what stops a double-press
  # from capturing the already-ducked volume as the "previous" volume.
  debounce_seconds: 8.0

  # Soft fade instead of a hard jump. 0 disables.
  fade_ms: 300
  fade_steps: 4

  # Abandon a source restore if the snapshot is older than this (crash guard).
  state_ttl_seconds: 120.0

  # When a target zone is grouped under a primary that isn't itself a target:
  #   primary — chime via that primary (the whole group hears it)
  #   skip    — leave that group alone
  group_policy: primary

  # Put a paused player back to paused rather than leaving it playing.
  restore_pause_state: true

  http_timeout_seconds: 5.0

webhook:
  # Shared secret. Protect must send it as ?token=... or an X-Doorbell-Token
  # header. Leave blank to disable the check on a trusted VLAN.
  token: "change-me"

  # Optional allowlist so only your front door camera can ring. Matched as a
  # case-insensitive substring against the Protect payload. Leave empty to
  # accept every ring the webhook delivers.
  allowed_devices: []
    # - "Front Door"
